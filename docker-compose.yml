version: '3.8'

services:
  web:
    build: .
    container_name: shelterlink_web
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=production-secure-key-shelterlink-2026-x
      - DATABASE_URL=sqlite:///instance/shelterlink.db
      - SESSION_COOKIE_SECURE=False
    volumes:
      - ./instance:/app/instance
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
