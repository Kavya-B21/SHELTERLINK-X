{% extends "base.html" %}

{% block title %}{{ title }} — SHELTERLINK X{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-8">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-white py-3">
        <h4 class="fw-bold mb-0 text-dark"><i class="bi bi-building-add text-primary me-2"></i> {{ title }}</h4>
      </div>
      <div class="card-body p-4">
        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label fw-semibold">Shelter Unique Code <span class="text-danger">*</span></label>
              <input type="text" name="shelter_code" class="form-control" placeholder="e.g. SHELTER-008" 
                     value="{{ shelter.shelter_code if shelter else '' }}" {% if shelter %}readonly{% endif %} required>
              <div class="form-text small">Permanent identifier</div>
            </div>

            <div class="col-md-8">
              <label class="form-label fw-semibold">Shelter Facility Name <span class="text-danger">*</span></label>
              <input type="text" name="name" class="form-control" placeholder="e.g. City Polytechnic Indoor Sports Complex" 
                     value="{{ shelter.name if shelter else '' }}" required>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Disaster Operational Sector / Area <span class="text-danger">*</span></label>
              <input type="text" name="location_name" class="form-control" placeholder="e.g. East River Basin" 
                     value="{{ shelter.location_name if shelter else '' }}" required>
            </div>

            <div class="col-md-3">
              <label class="form-label fw-semibold">Latitude</label>
              <input type="number" step="0.0001" name="latitude" class="form-control" placeholder="13.0500" 
                     value="{{ shelter.latitude if shelter else '' }}">
            </div>

            <div class="col-md-3">
              <label class="form-label fw-semibold">Longitude</label>
              <input type="number" step="0.0001" name="longitude" class="form-control" placeholder="80.2500" 
                     value="{{ shelter.longitude if shelter else '' }}">
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label fw-semibold">Total Authorized Capacity (Beds) <span class="text-danger">*</span></label>
              <input type="number" name="total_capacity" class="form-control" min="1" max="5000" 
                     value="{{ shelter.total_capacity if shelter else 150 }}" required>
            </div>

            {% if not shelter %}
            <div class="col-md-4">
              <label class="form-label fw-semibold">Initial Occupancy</label>
              <input type="number" name="current_occupancy" class="form-control" min="0" 
                     value="0">
            </div>
            {% endif %}

            <div class="col-md-4">
              <label class="form-label fw-semibold">Reserved / Transit Capacity</label>
              <input type="number" name="reserved_capacity" class="form-control" min="0" 
                     value="{{ shelter.reserved_capacity if shelter else 0 }}">
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold">Operational Status</label>
              <select name="status" class="form-select">
                <option value="Active" {% if shelter and shelter.status == 'Active' %}selected{% endif %}>Active</option>
                <option value="Approaching Capacity" {% if shelter and shelter.status == 'Approaching Capacity' %}selected{% endif %}>Approaching Capacity</option>
                <option value="Full" {% if shelter and shelter.status == 'Full' %}selected{% endif %}>Full</option>
                <option value="Temporarily Closed" {% if shelter and shelter.status == 'Temporarily Closed' %}selected{% endif %}>Temporarily Closed</option>
                <option value="Inactive" {% if shelter and shelter.status == 'Inactive' %}selected{% endif %}>Inactive</option>
              </select>
            </div>
          </div>

          <!-- Facility Checkboxes -->
          <div class="card bg-light border p-3 mb-3">
            <h6 class="fw-bold mb-2 text-dark"><i class="bi bi-check2-square text-primary me-2"></i> Verified Essential Facilities</h6>
            <div class="row g-2 small">
              <div class="col-md-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" name="has_accessibility_ramps" value="1" id="c_acc"
                         {% if shelter and shelter.has_accessibility_ramps %}checked{% endif %}>
                  <label class="form-check-label" for="c_acc">Wheelchair Ramps & Accessibility</label>
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" name="has_drinking_water" value="1" id="c_wat"
                         {% if (shelter and shelter.has_drinking_water) or not shelter %}checked{% endif %}>
                  <label class="form-check-label" for="c_wat">Potable Drinking Water</label>
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" name="has_food_supply" value="1" id="c_foo"
                         {% if (shelter and shelter.has_food_supply) or not shelter %}checked{% endif %}>
                  <label class="form-check-label" for="c_foo">Emergency Food Supplies</label>
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" name="has_medical_support" value="1" id="c_med"
                         {% if shelter and shelter.has_medical_support %}checked{% endif %}>
                  <label class="form-check-label" for="c_med">On-Site Emergency Medical Aid</label>
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" name="has_sanitation" value="1" id="c_san"
                         {% if (shelter and shelter.has_sanitation) or not shelter %}checked{% endif %}>
                  <label class="form-check-label" for="c_san">Functioning Sanitation / Restrooms</label>
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" name="has_family_rooms" value="1" id="c_fam"
                         {% if shelter and shelter.has_family_rooms %}checked{% endif %}>
                  <label class="form-check-label" for="c_fam">Family Partition Quarters</label>
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" name="has_power_backup" value="1" id="c_pow"
                         {% if shelter and shelter.has_power_backup %}checked{% endif %}>
                  <label class="form-check-label" for="c_pow">Emergency Generator Power</label>
                </div>
              </div>
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Site Contact Person</label>
              <input type="text" name="contact_person" class="form-control" placeholder="e.g. Officer Sunita Rao" 
                     value="{{ shelter.contact_person if shelter else '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Emergency Phone Number</label>
              <input type="text" name="contact_phone" class="form-control" placeholder="e.g. +91-9876543210" 
                     value="{{ shelter.contact_phone if shelter else '' }}">
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">Operational Notes</label>
              <textarea name="notes" class="form-control" rows="2" placeholder="Structural assessment or operational guidelines...">{{ shelter.notes if shelter else '' }}</textarea>
            </div>
          </div>

          <div class="d-flex justify-content-between">
            <a href="{{ url_for('shelters.index') }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary-custom px-4">
              <i class="bi bi-save me-1"></i> Save Shelter Specifications
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
